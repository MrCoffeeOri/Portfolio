# Deploys the src/ folder to GitHub Pages on every push to master
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # config.js is gitignored; it is generated here from the repository secrets.
      # The secrets are passed through env instead of being pasted into the script.
      - name: Create config with environment variables
        env:
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          SERVICE_ID: ${{ secrets.SERVICE_ID }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
        run: |
          cat > src/config.js << EOF
          window.EMAILJS_CONFIG = {
              PUBLIC_KEY: '${PUBLIC_KEY}',
              SERVICE_ID: '${SERVICE_ID}',
              TEMPLATE_ID: '${TEMPLATE_ID}'
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
